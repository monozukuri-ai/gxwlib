<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>gxwlib · Ladder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#182b45;font:14px system-ui,sans-serif}
header{padding:20px 28px;background:#fff;border-bottom:1px solid #dce3ee;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
h1{font-size:22px;margin:0}header p{margin:5px 0 0;color:#53657e}.badge{border-radius:20px;background:#e5f2ee;padding:6px 12px;font-weight:600}.badge.partial{background:#fff0d7;color:#885718}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 135px)}#canvas{overflow:auto;padding:16px}aside{overflow:auto;background:white;border-left:1px solid #dce3ee;padding:18px}
button,input{font:inherit}button{cursor:pointer}#zoom{width:120px}#selection{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4fa;padding:12px;border-radius:8px;font:12px/1.7 ui-monospace,monospace}h2{font-size:14px;margin-top:22px}
#instructions{display:flex;flex-direction:column;gap:3px}#instructions button{padding:7px;text-align:left;background:transparent;border:1px solid transparent;border-radius:5px;font:12px ui-monospace,monospace;color:#334761}#instructions button:hover,#instructions button.selected{background:#dbeafe;border-color:#93b4ed}#instructions button.unknown{color:#986124}#findings p{padding:8px;background:#fff6e5;font-size:12px;border-radius:6px;overflow-wrap:anywhere}.hint{padding:10px 28px;color:#53657e;font-size:12px;margin:0}svg{display:block;max-width:none}
@media(max-width:800px){main{grid-template-columns:1fr;height:auto}#canvas{max-height:65vh}aside{border-left:0;border-top:1px solid #dce3ee}header{padding:16px}}
</style>
<header><div><h1 id="name">Ladder</h1><p>GX Works2 · 命令列から再配置したラダー</p></div><span id="status" class="badge"></span><label>表示倍率 <input id="zoom" type="range" min="25" max="150" value="100"> <output id="zoom-value">100%</output></label></header>
<p class="hint">出力ごとに条件を表示します。#番号は元の接点・出力命令です。同じ#の再表示は、同じ評価済み条件を参照します。</p>
<main><section id="canvas" aria-label="ラダー図">{{SVG}}</section><aside><h2>元命令との対応</h2><pre id="selection" aria-live="polite">接点・コイル・制御命令を選択してください。</pre><h2>診断</h2><div id="findings"></div><h2>命令一覧</h2><div id="instructions"></div></aside></main>
<script type="application/json" id="gxw-data">{{DATA}}</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("gxw-data").textContent);
document.getElementById("name").textContent=data.name||"Ladder";
const status=document.getElementById("status");status.textContent=data.complete?"対応範囲の接続を構築済み":"部分表示 · 未解決箇所あり";status.classList.toggle("partial",!data.complete);
const list=document.getElementById("instructions"),findings=document.getElementById("findings"),selection=document.getElementById("selection");
const nodes=new Map();
function select(index){
 const i=data.instructions[index];if(!i)return;
 document.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));
 (nodes.get(index)||[]).forEach(e=>e.classList.add("selected"));
 const s=i.source;selection.dataset.instruction=String(index);selection.dataset.offset=String(s.offset);selection.dataset.length=String(s.length);
 selection.textContent=`#${index} ${i.mnemonic} ${i.operands.join(" ")}\nstep: ${i.step??"unknown"}\nsource: ${data.origin} / ${s.source_id??"file"}\noffset: ${s.offset}\nlength: ${s.length}\nSHA-256: ${data.sha256}\nbytes: ${i.bytes_preview}${i.preview_truncated?" …":""}`;
}
function bind(el,index){if(!nodes.has(index))nodes.set(index,[]);nodes.get(index).push(el);el.addEventListener("click",()=>select(index));el.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();select(index);}});}
for(const el of document.querySelectorAll("#canvas [data-instruction]"))bind(el,Number(el.dataset.instruction));
for(const i of data.instructions){const b=document.createElement("button");b.type="button";b.dataset.instruction=String(i.instruction);b.classList.toggle("unknown",!i.supported||i.instruction>=data.processed_instructions);b.textContent=`#${i.instruction} ${i.mnemonic} ${i.operands.join(" ")}`;bind(b,i.instruction);list.appendChild(b);}
for(const d of [...data.diagnostics,...data.input_diagnostics]){const p=document.createElement("p");p.textContent=`${d.code}: ${d.message}`;findings.appendChild(p);}
for(const s of data.opaque_regions){const p=document.createElement("p");p.textContent=`未解釈領域: source=${s.source_id??"file"}, offset=${s.offset}, length=${s.length}`;findings.appendChild(p);}
if(!findings.childNodes.length)findings.textContent="接続構造の診断はありません。";
const svg=document.querySelector("#canvas svg"),w=Number(svg.getAttribute("width")),h=Number(svg.getAttribute("height"));
document.getElementById("zoom").addEventListener("input",event=>{const scale=Number(event.target.value)/100;svg.style.width=`${w*scale}px`;svg.style.height=`${h*scale}px`;document.getElementById("zoom-value").textContent=`${event.target.value}%`;});
</script></html>
