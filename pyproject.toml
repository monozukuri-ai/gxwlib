[project]
name = "gxwlib"
dynamic = ["version"]
description = "Read-only GX Works2 project inspection powered by Rust"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project.scripts]
gxw = "gxwlib.cli:main"

[dependency-groups]
dev = ["maturin==1.11.5", "pytest>=8,<10", "ruff>=0.13,<1"]

[tool.maturin]
manifest-path = "crates/gxw-python/Cargo.toml"
python-source = "src"
module-name = "gxwlib._core"
bindings = "pyo3"
exclude = [".internal/**", "data/**", "fuzz/**", "**/__pycache__/**", "**/*.pyc"]
include = [
    { path = "Cargo.lock", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
    { path = "scripts/**/*", format = "sdist" },
    { path = "docs/**/*", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py313"
line-length = 100
