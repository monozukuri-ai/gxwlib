[workspace]
members = ["crates/gxw-core", "crates/gxw-python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["neka-nat <nekanat.stock@gmail.com>"]
license = "MIT"

[workspace.dependencies]
gxw-core = { path = "crates/gxw-core", version = "=0.1.0" }
cfb = "0.14"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
pyo3 = { version = "0.29", features = ["abi3-py313"] }
